name: CI

on:
  push:
    branches: [main, claude/**]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r backend/requirements/dev.txt
      - name: Catalogue + SM coverage
        run: |
          cd backend
          DJANGO_SETTINGS_MODULE=core.settings.test python -m apps.audit.checks catalogue
          DJANGO_SETTINGS_MODULE=core.settings.test python -m apps.audit.checks event_coverage
          DJANGO_SETTINGS_MODULE=core.settings.test python -m apps.audit.checks sm_coverage
      - name: Ruff
        run: cd backend && ruff check apps core
      - name: Tests
        run: cd backend && pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci || npm install
      - run: cd frontend && npm run typecheck || true
      - run: cd frontend && npm run lint || true
