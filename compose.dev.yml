name: keyhan-gold-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keyhan
      POSTGRES_PASSWORD: keyhan
      POSTGRES_DB: keyhan
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyhan"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: keyhan
      MINIO_ROOT_PASSWORD: keyhansecret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        REQ: dev
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.dev
      DATABASE_URL: postgres://keyhan:keyhan@postgres:5432/keyhan
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: dev-secret-change-me
      SERVICE_ENV: dev
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  celery_worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args: { REQ: dev }
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.dev
      DATABASE_URL: postgres://keyhan:keyhan@postgres:5432/keyhan
      REDIS_URL: redis://redis:6379/0
    command: celery -A core worker -l info
    volumes: ["./backend:/app"]
    depends_on: [backend]

  celery_beat:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args: { REQ: dev }
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.dev
      DATABASE_URL: postgres://keyhan:keyhan@postgres:5432/keyhan
      REDIS_URL: redis://redis:6379/0
    command: celery -A core beat -l info -S django_celery_beat.schedulers:DatabaseScheduler
    volumes: ["./backend:/app"]
    depends_on: [backend]

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    ports: ["3000:3000"]
    depends_on: [backend]

  # ----- ELK -----
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "false"
    ports: ["9200:9200"]
    volumes: ["es-data:/usr/share/elasticsearch/data"]

  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.3
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      ES_USER: ""
      ES_PASS: ""
    volumes:
      - ./docker/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./docker/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    ports: ["5044:5044"]
    depends_on: [elasticsearch]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["5601:5601"]
    depends_on: [elasticsearch]

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.14.3
    user: root
    volumes:
      - ./docker/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [logstash]
    command: ["--strict.perms=false"]

  # ----- Optional dev tooling -----
  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  es-data:
