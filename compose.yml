name: keyhan-gold

services:
  traefik:
    image: traefik:v3.1
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=ops@keyhan.gold"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports: ["80:80", "443:443"]
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
      - "./docker/traefik/dynamic.yml:/dynamic.yml:ro"

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-keyhan}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME:-keyhan}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-keyhan}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASS}"]
    volumes: ["redis-data:/data"]

  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes: ["minio-data:/data"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio.rule=Host(`minio.${DOMAIN}`)
      - traefik.http.routers.minio.entrypoints=websecure
      - traefik.http.routers.minio.tls.certresolver=le
      - traefik.http.services.minio.loadbalancer.server.port=9001

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args: { REQ: prod }
    restart: always
    env_file: [".env"]
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
      SERVICE_ENV: prod
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.routers.api.middlewares=security-headers@file
      - traefik.http.services.api.loadbalancer.server.port=8000

  daphne:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args: { REQ: prod }
    restart: always
    env_file: [".env"]
    command: ["daphne", "-b", "0.0.0.0", "-p", "9000", "core.asgi:application"]
    depends_on: [backend]
    labels:
      - traefik.enable=true
      - traefik.http.routers.ws.rule=Host(`api.${DOMAIN}`) && PathPrefix(`/ws`)
      - traefik.http.routers.ws.entrypoints=websecure
      - traefik.http.routers.ws.tls.certresolver=le
      - traefik.http.services.ws.loadbalancer.server.port=9000

  celery_worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args: { REQ: prod }
    restart: always
    env_file: [".env"]
    command: ["celery", "-A", "core", "worker", "-l", "info", "-Q", "default,priority"]
    depends_on: [backend]

  celery_beat:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args: { REQ: prod }
    restart: always
    env_file: [".env"]
    command: ["celery", "-A", "core", "beat", "-l", "info", "-S", "django_celery_beat.schedulers:DatabaseScheduler"]
    depends_on: [backend]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: always
    environment:
      BACKEND_URL: http://backend:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.routers.web.middlewares=security-headers@file
      - traefik.http.services.web.loadbalancer.server.port=3000

  # ----- ELK -----
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    restart: always
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD}
    volumes: ["es-data:/usr/share/elasticsearch/data"]

  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.3
    restart: always
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
      ES_USER: elastic
      ES_PASS: ${ELASTICSEARCH_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASS: ${REDIS_PASS}
    volumes:
      - ./docker/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./docker/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    depends_on: [elasticsearch, redis]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    restart: always
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
    depends_on: [elasticsearch]
    labels:
      - traefik.enable=true
      - traefik.http.routers.kibana.rule=Host(`kibana.${DOMAIN}`)
      - traefik.http.routers.kibana.entrypoints=websecure
      - traefik.http.routers.kibana.tls.certresolver=le
      - traefik.http.services.kibana.loadbalancer.server.port=5601

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.14.3
    restart: always
    user: root
    volumes:
      - ./docker/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["--strict.perms=false"]
    depends_on: [logstash]

  # ----- Prometheus + Grafana -----
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: always
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes: ["grafana-data:/var/lib/grafana"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=le
      - traefik.http.services.grafana.loadbalancer.server.port=3000

volumes:
  postgres-data:
  redis-data:
  minio-data:
  es-data:
  prometheus-data:
  grafana-data:
  letsencrypt:
