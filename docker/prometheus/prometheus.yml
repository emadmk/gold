global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]

  - job_name: elasticsearch
    static_configs:
      - targets: ["elasticsearch:9200"]
