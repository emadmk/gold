input {
  # Domain events shipped via Redis Streams from emit_event()
  redis {
    host => "${REDIS_HOST:redis}"
    password => "${REDIS_PASS:}"
    key => "domain_events.domain"
    data_type => "stream"
    consumer_group => "logstash"
    consumer => "${HOSTNAME}-domain"
    type => "domain_event"
  }
  redis {
    host => "${REDIS_HOST:redis}"
    password => "${REDIS_PASS:}"
    key => "domain_events.security"
    data_type => "stream"
    consumer_group => "logstash"
    consumer => "${HOSTNAME}-security"
    type => "domain_event"
  }
  redis {
    host => "${REDIS_HOST:redis}"
    password => "${REDIS_PASS:}"
    key => "domain_events.aml"
    data_type => "stream"
    consumer_group => "logstash"
    consumer => "${HOSTNAME}-aml"
    type => "domain_event"
  }
  redis {
    host => "${REDIS_HOST:redis}"
    password => "${REDIS_PASS:}"
    key => "domain_events.system"
    data_type => "stream"
    consumer_group => "logstash"
    consumer => "${HOSTNAME}-system"
    type => "domain_event"
  }
  redis {
    host => "${REDIS_HOST:redis}"
    password => "${REDIS_PASS:}"
    key => "domain_events.ux"
    data_type => "stream"
    consumer_group => "logstash"
    consumer => "${HOSTNAME}-ux"
    type => "domain_event"
  }
  # Process logs shipped by Filebeat
  beats {
    port => 5044
  }
}

filter {
  if [type] == "domain_event" {
    # Streams encode payload as a hash with field 'event'
    if [event] {
      json {
        source => "event"
        target => "doc"
      }
      ruby {
        code => "
          doc = event.get('doc') || {}
          ev = doc['event'] || {}
          category = ev['category'] || 'domain'
          event.set('@metadata][index]', 'keyhan-events-' + category + '-' + event.get('@timestamp').time.strftime('%Y.%m.%d'))
          # promote nested fields to top-level so Kibana visualises them
          event.set('event_kind', ev['kind'])
          event.set('event_category', category)
          event.set('severity', ev['severity'])
          event.set('outcome', ev['outcome'])
          event.set('actor', doc['actor'])
          event.set('target', doc['target'])
          event.set('correlation', doc['correlation'])
          event.set('data', doc['data'])
          event.set('state', doc['state'])
        "
      }
      mutate { remove_field => ["event", "doc"] }
    }
  } else {
    mutate { add_field => { "[@metadata][index]" => "keyhan-logs-%{+YYYY.MM.dd}" } }
  }

  # Defence-in-depth PII redaction
  mutate {
    remove_field => [
      "[actor][national_id]", "[actor][iban]",
      "[data][national_id]", "[data][iban]",
      "[data][password]", "[data][otp]"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "${ES_USER:elastic}"
    password => "${ES_PASS:}"
    index => "%{[@metadata][index]}"
  }
  if "_jsonparsefailure" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      user => "${ES_USER:elastic}"
      password => "${ES_PASS:}"
      index => "keyhan-events-dlq-%{+YYYY.MM.dd}"
    }
  }
}
