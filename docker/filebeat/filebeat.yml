filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: true
      hints.default_config:
        type: container
        paths:
          - /var/lib/docker/containers/${data.container.id}/*.log

processors:
  - add_docker_metadata: ~
  - decode_json_fields:
      fields: ["message"]
      target: "json"
      overwrite_keys: true
      add_error_key: true
  - drop_event:
      when:
        regexp:
          json.message: "^GET /metrics"

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.json: true
